<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Roboto, sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #080818, #101030, #0b0b22);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

#fireworksCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.card {
  position: relative;
  z-index: 1;
  width: 360px;
  padding: 40px 32px;
  background: rgba(18, 18, 35, 0.72);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  backdrop-filter: blur(12px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

.card h1 {
  text-align: center;
  font-size: 26px;
  font-weight: 500;
  margin-bottom: 32px;
  color: #f0f0ff;
}

.label {
  display: block;
  font-size: 14px;
  color: #b8b8d8;
  margin-bottom: 8px;
}

#password {
  width: 100%;
  padding: 13px 16px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

#password:focus {
  border-color: #5886ff;
  box-shadow: 0 0 0 3px rgba(88,134,255,0.22);
}

#signinBtn {
  margin-top: 24px;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg, #3b69e4, #6344dd);
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.2s ease, filter 0.25s ease;
}

#signinBtn:hover {
  filter: brightness(1.12);
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(70,100,240,0.35);
}

.tip {
  margin-top: 20px;
  text-align: center;
  font-size: 13px;
  color: #8888aa;
}
</style>
</head>
<body>
<canvas id="fireworksCanvas"></canvas>
<div class="card">
  <h1>Sign In</h1>
  <label class="label" for="password">Password</label>
  <input id="password" type="password" placeholder="Enter password">
  <button id="signinBtn">Sign in</button>
  <div class="tip">Access requires authorization</div>
</div>

<script>
const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');
let w, h;
const particles = [];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y, color, vx, vy, life) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.vx = vx;
    this.vy = vy;
    this.life = life;
    this.maxLife = life;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += 0.03;
    this.life--;
  }
  draw() {
    const alpha = this.life / this.maxLife;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI*2);
    ctx.fillStyle = this.color.replace('1)', alpha+')');
    ctx.fill();
  }
}

function randomColor() {
  const colors = [
    'rgba(255,90,90,1)',
    'rgba(90,180,255,1)',
    'rgba(255,220,90,1)',
    'rgba(120,255,160,1)',
    'rgba(220,130,255,1)'
  ];
  return colors[Math.floor(Math.random()*colors.length)];
}

function createFirework() {
  const x = Math.random() * w;
  const y = Math.random() * h * 0.65;
  const color = randomColor();
  for(let i=0; i<70; i++){
    const ang = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push(new Particle(x, y, color, Math.cos(ang)*spd, Math.sin(ang)*spd, 60+Math.random()*30));
  }
}

function loop(){
  ctx.fillStyle = 'rgba(8,8,24,0.12)';
  ctx.fillRect(0,0,w,h);
  for(let i = particles.length-1; i >=0; i--){
    const p = particles[i];
    p.update();
    p.draw();
    if(p.life <= 0) particles.splice(i,1);
  }
  requestAnimationFrame(loop);
}
loop();

setInterval(createFirework, 1400);

const input = document.getElementById('password');
const btn = document.getElementById('signinBtn');
function triggerSignIn(){
  alert('Access denied');
}
btn.onclick = triggerSignIn;
input.addEventListener('keydown', e=>{
  if(e.key === 'Enter') triggerSignIn();
})
</script>
</body>
</html>
